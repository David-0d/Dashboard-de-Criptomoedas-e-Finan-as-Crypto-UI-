<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GGOX | Crypto Trade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="logo">GGOX.</div>
            <nav>
                <a href="#" class="active">Markets</a>
                <a href="#">Trade</a>
                <a href="#">Derivatives</a>
            </nav>
            <div class="user-actions">
                <button class="btn-outline">Log In</button>
                <button class="btn-glow">Sign Up</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <div class="card asset-card">
                <div class="asset-header">
                    <h3>BTC / USDT</h3>
                    <span class="badge positive">+2.45%</span>
                </div>
                <div class="price-display">
                    <h1>$63,721.30</h1>
                    <p>24h High: $64,210.50</p>
                </div>
            </div>

            <div class="card chart-card">
                <div class="chart-header">
                    <span>Gráfico de Desempenho (Tempo Real)</span>
                    <div class="timeframes">
                        <span class="active">1H</span>
                        <span>1D</span>
                        <span>1W</span>
                    </div>
                </div>
                <div class="chart-mockup-visual">
                    <div class="wave-line"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
